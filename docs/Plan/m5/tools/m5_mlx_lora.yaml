# M5-C: MLX-LM LoRA on the official QAT weights (bf16 text-only dir). NOTE: QLoRA on the exact-grid g32 model
# (out/m5/mlx-qat-g32exact) crashes with [METAL] Command buffer execution failed: Internal Error (0000000e), see log.
model: out/m5/qat-text-hf
train: true
data: docs/Plan/m5/raw/mlx_data
fine_tune_type: lora
optimizer: adamw
num_layers: -1
batch_size: 1
iters: 1000
learning_rate: 1.0e-4
max_seq_length: 512
steps_per_report: 25
steps_per_eval: 200
val_batches: 8
save_every: 100
grad_checkpoint: true
adapter_path: out/m5/mlx_lora
seed: 0
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
  rank: 16
  scale: 2.0
  dropout: 0.0

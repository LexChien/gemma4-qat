[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g4qat"
version = "0.1.0"
description = "Gemma 4 E2B QAT / LoRA-QAT / export toolkit (refactor of M0–M9 tools)"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
g4qat = "g4qat.cli:main"

[tool.setuptools]
include-package-data = true
packages = [
  "g4qat",
  "g4qat.export",
  "g4qat.eval",
  "g4qat.io",
  "g4qat.mlx",
  "g4qat.data",
  "g4qat.jax",
  "g4qat.tests",
]

[tool.setuptools.package-dir]
g4qat = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
